<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iRacing AI: Season Builder</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <h1>iRacing AI Season Builder</h1>
          <p class="brand-subtitle">Build AI season JSON files from the current season schedule.</p>
        </div>
      </header>

      <section class="workspace">
        <form id="selectorForm" class="panel">
          <div class="field">
            <label for="seasonSelect">Season</label>
            <select id="seasonSelect" name="season" required>
              <option value="">Loading latest season...</option>
            </select>
          </div>

          <div class="field">
            <label for="seriesSelect">Series</label>
            <select id="seriesSelect" name="series" required>
              <option value="">Loading series...</option>
            </select>
          </div>

          <div class="field">
            <label for="carSelect">Your Car</label>
            <select id="carSelect" name="car" required></select>
          </div>

          <div class="field">
            <label for="fileNameInput">Output File Name</label>
            <input id="fileNameInput" name="fileName" type="text" readonly />
          </div>

          <button id="downloadBtn" type="submit">Generate &amp; Download JSON</button>
        </form>
      </section>

      <p id="status" class="status" aria-live="polite"></p>

      <footer class="footer">
        <p class="footer-note">Not affiliated with iRacing.com Motorsport Simulations.</p>
        <div class="footer-links">
          <a href="https://github.com/sdcarter/iracing-ai-season-builder" target="_blank" rel="noreferrer">GitHub</a>
          <span aria-hidden="true">·</span>
          <a href="https://github.com/sdcarter/iracing-ai-season-builder" target="_blank" rel="noreferrer">Open Source</a>
        </div>
      </footer>
    </main>

    <script type="module">
      await import("./app.js");
    </script>
  </body>
</html>
